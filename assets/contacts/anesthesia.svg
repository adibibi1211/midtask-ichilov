<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <!-- Anesthesia team: surgical cap, face mask and a heart-rate monitor -->
  <rect width="320" height="180" fill="#eaf5fb"/>
  <circle cx="225" cy="98" r="72" fill="#d5ebf5"/>
  <circle cx="300" cy="148" r="7" fill="#c4e4f1"/>
  <circle cx="24" cy="26" r="5" fill="#c4e4f1"/>
  <!-- Monitor on a stand -->
  <g transform="translate(32 30)">
    <rect x="44" y="84" width="12" height="40" fill="#a3c3d6"/>
    <rect x="22" y="120" width="56" height="10" rx="5" fill="#a3c3d6"/>
    <rect width="100" height="86" rx="10" fill="#0c2e82"/>
    <rect x="8" y="8" width="84" height="56" rx="5" fill="#0a2468"/>
    <polyline points="12,40 30,40 36,26 44,54 52,34 58,40 88,40" fill="none" stroke="#3dbee3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="75" r="4" fill="#3dbee3"/>
    <rect x="32" y="72" width="34" height="6" rx="3" fill="#2c4f9e"/>
  </g>
  <!-- Anesthesia team member -->
  <path d="M168 180c0-36 18-54 42-54s42 18 42 54z" fill="#0b6f98"/>
  <path d="M199 126l11 16 11-16" fill="none" stroke="#bfe8f4" stroke-width="3" stroke-linejoin="round"/>
  <rect x="203" y="104" width="14" height="16" rx="5" fill="#6e4530"/>
  <circle cx="210" cy="88" r="21" fill="#8d5b3e"/>
  <!-- Surgical cap -->
  <path d="M188 86c0-19 10-28 22-28s22 9 22 28c-6-5-13-7-22-7s-16 2-22 7z" fill="#3dbee3"/>
  <circle cx="200" cy="68" r="2" fill="#fff" opacity=".7"/>
  <circle cx="214" cy="65" r="2" fill="#fff" opacity=".7"/>
  <circle cx="224" cy="72" r="2" fill="#fff" opacity=".7"/>
  <circle cx="203" cy="90" r="2" fill="#1f2d4d"/>
  <circle cx="217" cy="90" r="2" fill="#1f2d4d"/>
  <!-- Face mask lowered under the chin -->
  <rect x="197" y="100" width="26" height="14" rx="6" fill="#e6f6fb" stroke="#bfe8f4" stroke-width="1.5"/>
  <path d="M197 104l-8-6M223 104l8-6" stroke="#bfe8f4" stroke-width="1.5"/>
  <path d="M202 106h16M202 110h16" stroke="#bfe8f4" stroke-width="1.2"/>
